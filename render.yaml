services:
  - type: web
    name: slbooking-api
    region: singapore
    runtime: python-3.12
    rootDir: backend
    autoDeploy: true
    buildCommand: python -m pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: /opt/render/project/src/.venv/bin/python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        # Render web services are served from <service-name>.onrender.com,
        # NOT .render.com - that was rejecting every real request with
        # Django's DisallowedHost 400 error. Includes both the Render
        # subdomain and the eventual custom domain from CLAUDE.md.
        value: "slbooking-api.onrender.com,slbooking.hotel.lk,www.slbooking.hotel.lk"
      - key: PYTHONUNBUFFERED
        value: "1"
