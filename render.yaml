services:
  - type: web
    name: slbooking-api
    runtime: python-3.12.1
    region: singapore
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt && cd backend && python manage.py collectstatic --noinput --clear --settings=config.settings.production
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "slbooking-api.render.com"
      - key: PYTHONUNBUFFERED
        value: "1"
