services:
  - type: web
    name: slbooking-api
    env: python
    runtime: python-3.12.1
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --no-cache-dir --only-binary=:all: -r requirements.txt && python manage.py check && python manage.py collectstatic --noinput --clear && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "slbooking-api.render.com"
      - key: PYTHONUNBUFFERED
        value: "1"
