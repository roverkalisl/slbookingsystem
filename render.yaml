# SINGLE-SERVICE DEPLOYMENT
# Django backend + Next.js frontend (Python runtime)
# Frontend built to static files, served by Django/WhiteNoise
# Database: Existing PostgreSQL in Oregon via fromDatabase

services:
  - type: web
    name: slbookingsystem
    region: oregon
    runtime: python
    rootDir: backend
    autoDeploy: true

    # Build: Frontend (npm) → Backend (pip) → Merge static files
    # Debugging: check at each step what files exist
    buildCommand: "sh -c 'cd frontend && npm install && npm run build 2>&1; echo \"NPM_EXIT_CODE=$?\"; ls -la ./ | head -20; echo \"Checking for .next...\"; [ -d .next ] && echo \".next exists\" || echo \".next MISSING\"; echo \"Checking for out...\"; [ -d out ] && echo \"out exists\" && ls -la out/ | head -10 || echo \"out MISSING\"; cd ../backend && python -m pip install -r requirements.txt && python manage.py collectstatic --noinput --clear && echo \"Copying frontend build...\"; cp -r ../frontend/out/* staticfiles/ 2>&1 || echo \"Copy failed\"; echo \"Final check:\"; ls -la staticfiles/ | head -10'"

    # Pre-deploy: Run migrations
    preDeployCommand: python manage.py migrate --noinput --settings=config.settings.production

    # Start: Gunicorn only (serves both API and static frontend)
    startCommand: /opt/render/project/src/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -

    healthCheckPath: /health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

      - key: DATABASE_URL
        fromDatabase:
          name: slbooking
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: NODE_VERSION
        value: "20.11.1"

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "slbookingsystem.onrender.com,slbooking.hotel.lk,www.slbooking.hotel.lk"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: NEXT_PUBLIC_API_URL
        value: "https://slbookingsystem.onrender.com/api"

      - key: NEXT_PUBLIC_SITE_URL
        value: "https://slbookingsystem.onrender.com"
