# SINGLE-SERVICE DEPLOYMENT
# Django backend + Next.js frontend (Python runtime)
# Frontend built to static files, served by Django/WhiteNoise
# Database: Existing PostgreSQL in Oregon via fromDatabase

services:
  - type: web
    name: slbookingsystem
    region: oregon
    runtime: python
    rootDir: backend
    autoDeploy: true

    # Build: Install Node.js → Frontend build → Django setup → Merge static files
    buildCommand: |-
      apt-get update && \
      apt-get install -y nodejs npm && \
      cd frontend && \
      npm install && \
      npm run build && \
      cd ../backend && \
      python -m pip install -r requirements.txt && \
      python manage.py collectstatic --noinput --clear && \
      cp -r ../frontend/out/* staticfiles/ 2>/dev/null || true

    # Pre-deploy: Run migrations
    preDeployCommand: python manage.py migrate --noinput --settings=config.settings.production

    # Start: Gunicorn only (serves both API and static frontend)
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -

    healthCheckPath: /health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

      - key: DATABASE_URL
        fromDatabase:
          name: slbooking
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: NODE_VERSION
        value: "20.11.1"

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "slbookingsystem.onrender.com,slbooking.hotel.lk,www.slbooking.hotel.lk"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: NEXT_PUBLIC_API_URL
        value: "https://slbookingsystem.onrender.com/api"

      - key: NEXT_PUBLIC_SITE_URL
        value: "https://slbookingsystem.onrender.com"
