# SINGLE-SERVICE DEPLOYMENT
# Django backend + Next.js frontend (Python runtime)
# Frontend built to static files, served by Django/WhiteNoise
# Database: Existing PostgreSQL in Oregon via fromDatabase

services:
  - type: web
    name: slbookingsystem
    region: oregon
    runtime: python
    rootDir: backend
    autoDeploy: true

    # Build: Execute build.sh script
    # build.sh: Install Node.js → Frontend build → Django setup → Merge static files
    buildCommand: bash build.sh

    # Pre-deploy: Run migrations and load fixtures
    preDeployCommand: python manage.py migrate --noinput --settings=config.settings.production && python manage.py seed_master_data --settings=config.settings.production

    # Start: Execute start.sh script
    # start.sh: Start Gunicorn (serves both API and static frontend)
    startCommand: bash start.sh

    healthCheckPath: /health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings.production"

      - key: DATABASE_URL
        fromDatabase:
          name: slbooking
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.12.0"

      - key: NODE_VERSION
        value: "20.11.1"

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "slbookingsystem.onrender.com,slbooking.hotel.lk,www.slbooking.hotel.lk"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://slbookingsystem.onrender.com,https://slbooking.hotel.lk,https://www.slbooking.hotel.lk"

      - key: PYTHONUNBUFFERED
        value: "1"

      - key: NEXT_PUBLIC_API_URL
        value: "https://slbookingsystem.onrender.com/api"

      # Where Stripe returns guests after payment - keep on a domain that is
      # already serving the app (switch to https://slbooking.hotel.lk only
      # once that domain points at this service).
      - key: NEXT_PUBLIC_SITE_URL
        value: "https://slbookingsystem.onrender.com"

      # Canonical public domain for SEO only: robots.txt, sitemap.xml,
      # canonical and Open Graph URLs.
      - key: CANONICAL_SITE_URL
        value: "https://slbooking.hotel.lk"

      # Google Analytics 4 measurement id (G-XXXXXXXXXX), read at BUILD time.
      # Left unset: analytics stays off. Enter the real id in the Render
      # dashboard - never commit it here.
      - key: NEXT_PUBLIC_GA_MEASUREMENT_ID
        sync: false

      # Google AdSense publisher id (public - it appears in every page).
      # Read at BUILD time by Next.js: loads the Auto Ads script on public
      # pages only. Remove/empty to disable the ads script. /ads.txt is served
      # from frontend/public/ads.txt.
      - key: NEXT_PUBLIC_ADSENSE_PUBLISHER_ID
        value: "pub-7289676285085159"
