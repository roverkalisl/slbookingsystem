services:
  - type: web
    name: slbooking-api
    env: python
    runtime: python-3.12.1
    region: singapore
    buildCommand: cd backend && pip install --upgrade pip setuptools && pip install --no-cache-dir -r requirements.txt && python manage.py check && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "slbooking-api.render.com"
