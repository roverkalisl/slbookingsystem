services:
  - type: web
    name: slbooking-api
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.1"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "slbooking-api.render.com"
      - key: PYTHONUNBUFFERED
        value: "1"
